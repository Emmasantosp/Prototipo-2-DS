spring.application.name=PlasSBServer
server.port=8081

# Swagger UI: http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Persistencia: base de datos H2 en disco
spring.datasource.url=jdbc:h2:file:./data/plassb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Consola web de H2: http://localhost:8081/h2-console (JDBC URL: jdbc:h2:file:./data/plassb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
