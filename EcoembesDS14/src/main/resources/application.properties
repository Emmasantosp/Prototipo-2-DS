spring.application.name=EcoembesDS14
server.port=8080

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Persistencia (Prototipo 2): base de datos H2 en disco
spring.datasource.url=jdbc:h2:file:./data/ecoembes
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Consola web de H2: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:file:./data/ecoembes)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Servicios externos de las plantas de reciclaje (usados por la factoria de gateways)
plantas.plassb.url=http://localhost:8081
plantas.contsocket.host=localhost
plantas.contsocket.port=9090
