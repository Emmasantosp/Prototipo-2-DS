plugins {
    id 'java'
    id 'application'
}

group = 'com.contsocket'
version = '1.0.0-P2'

repositories {
    mavenCentral()
}

// Compila para Java 21 con cualquier JDK 21 o superior (también Java 25)
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs << '-Xlint:all'
}

application {
    mainClass = 'com.contsocket.ContSocketServer'
}
